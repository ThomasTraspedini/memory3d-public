[workspace]
resolver = "2"
members = [
    "crates/memory3d-core",
    "crates/memory3d-cli",
    "crates/memory3d-python",
    "crates/memory3d-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
strip = "symbols"
