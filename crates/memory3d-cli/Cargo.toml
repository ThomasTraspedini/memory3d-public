[package]
name = "memory3d-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line adapter for Memory3D"
license = "MIT"

[[bin]]
name = "memory3d-cli"
path = "src/main.rs"

[dependencies]
memory3d-core = { path = "../memory3d-core" }
serde_json = "1.0.145"

[dev-dependencies]
rusqlite = { version = "0.37.0", features = ["bundled"] }
tempfile = "3.20.0"

[lints]
workspace = true
