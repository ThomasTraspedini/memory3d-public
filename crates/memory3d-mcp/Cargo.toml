[package]
name = "memory3d-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Local stdio MCP adapter for Memory3D"
license = "MIT"

[[bin]]
name = "memory3d-mcp"
path = "src/main.rs"

[dependencies]
memory3d-core = { path = "../memory3d-core" }
rmcp = { version = "2.0.0", features = ["transport-io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.20.0"

[lints]
workspace = true
