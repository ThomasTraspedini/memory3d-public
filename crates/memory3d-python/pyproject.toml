[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "memory3d"
dynamic = ["version"]
description = "Python bindings for the Memory3D local associative memory core"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["maturin==1.15.0", "pytest==8.4.2"]

[tool.maturin]
features = ["pyo3/extension-module"]
manifest-path = "Cargo.toml"
