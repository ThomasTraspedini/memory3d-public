name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: python -m pip install 'crates/memory3d-python[dev]'
      - run: maturin build --release --manifest-path crates/memory3d-python/Cargo.toml --out dist
      - run: python -m pip install dist/*.whl
      - run: python -m pytest crates/memory3d-python/tests
